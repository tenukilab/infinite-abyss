// Casino Island is fully offline. Medals are earned only by exchanging in-game gold or games.
function travel(destination){
 if(destination==='casino'){
  if(state.location!=='main'||tab!=='town')return;
  state.location='casino';tab='casino';
 }else if(destination==='main'){
  if(state.location!=='casino')return;
  state.location='main';tab='town';
 }else return;
 logEntry('移動',destination==='casino'?'カジノ島へ渡航':'カジノ島から帰還');save();render();
}
function exchangeMedals(m){
 if(state.location!=='casino'||!Number.isInteger(m)||m<1||m>1000)return;
 const cost=m*GOLD_PER_MEDAL;
 if(state.gold<cost){toast('ゴールドが足りません');return;}
 state.gold-=cost;state.medals+=m;
 state.casino.last=cost+'G を '+m+'メダルに交換した。';
 logEntry('メダル交換',cost+'G → '+m+'メダル');save();render();
}
function wagerFrom(selector){
 const value=Number($(selector)?.value);
 if(!Number.isInteger(value)||value<1||value>500){toast('賭けるメダルは1〜500枚');return null;}
 if(value>state.medals){toast('メダルが足りません');return null;}
 return value;
}
const pokerSuits=['♠','♥','♦','♣'];
function cardText(card){return {rank:card%13+2,suit:pokerSuits[Math.floor(card/13)]};}
function displayCard(card){const c=cardText(card);const r=({11:'J',12:'Q',13:'K',14:'A'})[c.rank]||c.rank;return r+c.suit;}
function shuffleDeck(){const deck=Array.from({length:52},(_,i)=>i);for(let i=51;i>0;i--){const j=ri(0,i);[deck[i],deck[j]]=[deck[j],deck[i]];}return deck;}
function pokerResult(cards){
 const ranks=cards.map(c=>cardText(c).rank).sort((a,b)=>a-b),suits=cards.map(c=>Math.floor(c/13));
 const counts={};for(const r of ranks)counts[r]=(counts[r]||0)+1;
 const byCount=Object.entries(counts).map(([k,v])=>({rank:Number(k),count:v})).sort((a,b)=>b.count-a.count||b.rank-a.rank);
 const flush=suits.every(v=>v===suits[0]);
 const uniq=[...new Set(ranks)];
 const straight=uniq.length===5&&(uniq[4]-uniq[0]===4||uniq.join(',')==='2,3,4,5,14');
 if(straight&&flush&&uniq[0]===10)return {name:'ロイヤルフラッシュ',mult:200};
 if(straight&&flush)return {name:'ストレートフラッシュ',mult:50};
 if(byCount[0].count===4)return {name:'フォーカード',mult:25};
 if(byCount[0].count===3&&byCount[1].count===2)return {name:'フルハウス',mult:9};
 if(flush)return {name:'フラッシュ',mult:6};
 if(straight)return {name:'ストレート',mult:4};
 if(byCount[0].count===3)return {name:'スリーカード',mult:3};
 if(byCount[0].count===2&&byCount[1].count===2)return {name:'ツーペア',mult:2};
 if(byCount[0].count===2&&byCount[0].rank>=11)return {name:'ジャックス・オア・ベター',mult:1};
 return {name:'ノーペア',mult:0};
}
function dealPoker(){
 if(state.location!=='casino'||state.casino.poker?.stage==='hold')return;
 const bet=wagerFrom('#pokerBet');if(!bet)return;
 state.medals-=bet;
 const deck=shuffleDeck();
 state.casino.poker={stage:'hold',bet,hand:deck.slice(0,5),remaining:deck.slice(5),held:[false,false,false,false,false],result:null};
 state.casino.plays++;state.casino.last='5枚配った。残したいカードを選んでドロー！';save();render();
}
function holdCard(index){
 const p=state.casino.poker;
 if(state.location!=='casino'||p?.stage!=='hold'||index<0||index>=5||!Number.isInteger(index))return;
 p.held[index]=!p.held[index];save();render();
}
function drawPoker(){
 const p=state.casino.poker;if(state.location!=='casino'||p?.stage!=='hold')return;
 for(let i=0;i<5;i++)if(!p.held[i])p.hand[i]=p.remaining.shift();
 const result=pokerResult(p.hand);
 // Luck: a small chance for one additional helpful draw when the hand would lose.
 if(!result.mult&&rand()<clamp(derived().luk*.0007,0,.045)){
  let best=null;
  for(let i=0;i<5;i++)for(let j=0;j<p.remaining.length;j++){
   const trial=[...p.hand];trial[i]=p.remaining[j];const r=pokerResult(trial);
   if(r.mult&&(!best||r.mult>best.result.mult))best={i,j,result:r};
  }
  if(best){p.hand[best.i]=p.remaining.splice(best.j,1)[0];result.name=best.result.name;result.mult=best.result.mult;}
 }
 const win=p.bet*result.mult;state.medals+=win;
 p.stage='finished';p.result={...result,win};delete p.remaining;
 state.casino.last=result.name+'：'+(win?win+'メダル獲得':'払い戻しなし')+'（賭け金'+p.bet+'）';
 logEntry('ポーカー',state.casino.last);save();render();
}
const rouletteReds=new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);
function rouletteWin(choice,number,picked){
 if(choice==='number')return number===picked;
 if(number===0)return false;
 if(choice==='red')return rouletteReds.has(number);
 if(choice==='black')return !rouletteReds.has(number);
 if(choice==='even')return number%2===0;
 if(choice==='odd')return number%2===1;
 return false;
}
function playRoulette(){
 if(state.location!=='casino')return;
 const bet=wagerFrom('#rouletteBet');if(!bet)return;
 const choice=$('#rouletteChoice')?.value;
 const picked=Number($('#rouletteNumber')?.value);
 if(!['red','black','even','odd','number'].includes(choice))return;
 if(choice==='number'&&(!Number.isInteger(picked)||picked<0||picked>36))return;
 state.medals-=bet;let number=ri(0,36);
 if(!rouletteWin(choice,number,picked)&&rand()<clamp(derived().luk*.0008,0,.055))number=ri(0,36);
 const won=rouletteWin(choice,number,picked),mult=choice==='number'?36:2,payout=won?bet*mult:0;
 state.medals+=payout;state.casino.plays++;
 const color=number===0?'緑':rouletteReds.has(number)?'赤':'黒';
 state.casino.last='ルーレット：'+number+'（'+color+'） '+(won?'当たり！ '+payout+'メダル獲得':'ハズレ')+' / '+bet+'メダル賭け';
 logEntry('ルーレット',state.casino.last);save();render();
}
function playRacing(){
 if(state.location!=='casino')return;
 const bet=wagerFrom('#raceBet');if(!bet)return;
 const choice=Number($('#raceHorse')?.value);
 if(!Number.isInteger(choice)||choice<0||choice>=horseRoster.length)return;
 state.medals-=bet;
 const total=horseRoster.reduce((n,h)=>n+h.weight,0);
 let ticket=ri(1,total),winner=horseRoster.findIndex(h=>{ticket-=h.weight;return ticket<=0;});
 if(winner!==choice&&rand()<clamp(derived().luk*.00055,0,.05))winner=choice;
 const won=winner===choice,payout=won?bet*horseRoster[choice].payout:0;
 state.medals+=payout;state.casino.plays++;
 state.casino.last='競馬：優勝 '+horseRoster[winner].name+' / '+(won?'的中！ '+payout+'メダル獲得':'ハズレ')+' / '+bet+'メダル賭け';
 logEntry('島の競馬',state.casino.last);save();render();
}
function redeemPrize(sku){
 if(state.location!=='casino')return;
 const prize=casinoPrizes.find(x=>x.sku===sku);
 if(!prize||state.casino.purchased.includes(sku))return;
 if(prize.job&&prize.job!==state.activeJob){toast('現在のジョブ専用の景品です');return;}
 if(state.medals<prize.cost){toast('メダルが足りません');return;}
 state.medals-=prize.cost;state.casino.purchased.push(sku);
 if(prize.kind==='weapon'){
  const oldHP=derived().maxHP;
  const item={id:'casino-'+state.nextId++,casinoSku:sku,job:prize.job,name:prize.name,slot:'weapon',stat:{...prize.stat},enhance:0,price:0};
  state.inventory.push(item);state.equipped.weapon=item.id;
  state.hp=clamp(state.hp+Math.max(0,derived().maxHP-oldHP),1,derived().maxHP);
 }else{state.casino.materials.push(sku);}
 state.casino.last=prize.name+'を交換した！';logEntry('カジノ景品交換',prize.name+' / '+prize.cost+'メダル');save();render();
}

function casinoRouletteHTML(){return `<section class="panel"><div class="kicker">EUROPEAN ROULETTE</div><h2 class="sectiontitle">◉ ルーレット</h2><p class="intro">0〜36の37マス。赤・黒・偶数・奇数は的中で2倍。数字一点は36倍。0は色・偶奇の対象外。</p>
 <div class="casino-controls"><label class="small">予想 <select id="rouletteChoice"><option value="red">赤</option><option value="black">黒</option><option value="even">偶数</option><option value="odd">奇数</option><option value="number">数字一点</option></select></label><label class="small">数字 <select id="rouletteNumber">${Array.from({length:37},(_,i)=>`<option value="${i}">${i}</option>`).join('')}</select></label><label class="small">賭け <input id="rouletteBet" type="number" min="1" max="500" value="1"></label></div><button class="btn gold" data-cas="roulette">ルーレットを回す</button></section>`;}
function casinoHorseHTML(){return `<section class="panel"><div class="kicker">ISLAND RACING</div><h2 class="sectiontitle">♞ 島の競馬</h2><p class="intro">4頭のうち勝つと思う1頭に単勝。各馬の勝ちやすさと配当が違う。</p>
 <div class="casino-controls"><label class="small">出走馬 <select id="raceHorse">${horseRoster.map((h,i)=>`<option value="${i}">${h.name}（${h.payout}倍）</option>`).join('')}</select></label><label class="small">賭け <input id="raceBet" type="number" min="1" max="500" value="1"></label></div><button class="btn gold" data-cas="racing">出走！</button></section>`;}
function casinoPrizesHTML(){return `<section class="panel"><div class="kicker">PRIZE EXCHANGE</div><h2 class="sectiontitle">✦ 景品交換所</h2><p class="intro">店売り武器を大きく上回る特別景品。交換済み景品は再入手できない。錆びた始原剣は将来の武器合成用に保管される。</p>
 ${casinoPrizes.map(item=>{const owned=state.casino.purchased.includes(item.sku),locked=!!item.job&&item.job!==state.activeJob;
 return `<div class="prize-item"><div><strong>${esc(item.name)}</strong><div class="tiny muted">${item.kind==='material'?'合成素材（今は装備不可）':jobs[item.job].name+'専用・武器'}</div><p>${item.kind==='material'?esc(item.description):esc(statLine(item.stat))}</p></div><button class="btn ${owned?'':'gold'}" data-prize="${item.sku}" ${owned||locked||state.medals<item.cost?'disabled':''}>${owned?'交換済み':locked?'別ジョブ専用':num(item.cost)+' M'}</button></div>`;}).join('')}
 ${state.casino.materials.length?`<p class="small muted">所持する合成素材：${state.casino.materials.map(s=>esc(casinoPrizes.find(x=>x.sku===s)?.name||s)).join('、')}</p>`:''}</section>`;}
function casinoHTML(){return `<section class="panel"><div class="kicker">CASINO ISLAND</div><h2 class="sectiontitle">カジノ島</h2><p class="intro">迷宮を離れ、船で訪れる娯楽の島。ここではゴールドではなくメダルを使う。ゲーム内通貨のみ・実際のお金との交換や換金はできない。</p>
 <div class="casino-grid"><div class="casino-balance"><span class="small">所持メダル</span><strong>${num(state.medals)} M</strong><span class="tiny muted">所持G：${num(state.gold)}</span></div><div class="casino-balance"><span class="small">遊戯回数</span><strong>${num(state.casino.plays)}</strong><span class="tiny muted">ジョブの「運」も抽選に微量影響</span></div></div>
 <hr class="divider"><div class="split"><h3 class="sectiontitle">両替所</h3><button class="btn ghost" data-travel="main">⛵ 拠点へ戻る</button></div><p class="intro">${GOLD_PER_MEDAL}G → 1メダル。現時点ではメダルからGへは戻せない。</p>
 <div class="buttonrow">${[1,10,50,100].map(m=>`<button class="btn" data-exchange="${m}" ${state.gold<m*GOLD_PER_MEDAL?'disabled':''}>${m}M<br>${num(m*GOLD_PER_MEDAL)}G</button>`).join('')}</div>
 ${state.casino.last?`<div class="casino-message" style="margin-top:14px">${esc(state.casino.last)}</div>`:''}</section>
 <div class="casino-grid"><div>${casinoPokerHTML()}</div><div>${casinoRouletteHTML()}</div><div class="wide">${casinoHorseHTML()}</div><div class="wide">${casinoPrizesHTML()}</div></div>`;}
function render(){
 renderHero();
 const nav=document.querySelector('.nav');
 if(state.location==='casino'){
  tab='casino';nav.innerHTML='<button data-tab="casino" class="active">♠ カジノ島</button>';
 }else{
  if(tab==='casino')tab='town';
  nav.innerHTML='<button data-tab="explore">⚔ 探索</button><button data-tab="gear">◇ 装備</button><button data-tab="town">⌂ 拠点</button><button data-tab="jobs">♜ ジョブ</button><button data-tab="record">≡ 記録</button>';
 }
 document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
 $('#view').innerHTML=tab==='casino'?casinoHTML():tab==='explore'?exploreHTML():tab==='gear'?gearHTML():tab==='town'?townHTML():tab==='jobs'?jobsHTML():recordHTML();
}
function exportSave(){const blob=new Blob([JSON.stringify({app:'INFINITE_ABYSS',exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='abyss-v06-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('JSON書き出し完了');}
function importSave(file){if(!file)return;const rd=new FileReader();rd.onload=()=>{try{const data=JSON.parse(rd.result),s=data.state||data;if(!valid(upgradeState(s)))throw Error('v0.5/0.6形式のみ対応');if(!confirm('現在のデータを上書きします。続けますか？'))return;state=s;lastResult=null;tab=state.location==='casino'?'casino':'explore';save();render();toast('データを復元しました');}catch(e){toast('読み込み失敗：'+e.message);}};rd.readAsText(file);}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.tab){if(state.location==='casino'&&b.dataset.tab!=='casino'){toast('拠点に帰還してから移動してください');return;}tab=b.dataset.tab;lastResult=null;render();return;}
 if(b.dataset.travel){travel(b.dataset.travel);return;}
 if(b.dataset.exchange){exchangeMedals(Number(b.dataset.exchange));return;}
 if(b.dataset.prize){redeemPrize(b.dataset.prize);return;}
 if(b.dataset.pokerhold!==undefined){holdCard(Number(b.dataset.pokerhold));return;}
 if(b.dataset.cas=== 'poker-deal'){dealPoker();return;}
 if(b.dataset.cas=== 'poker-draw'){drawPoker();return;}
 if(b.dataset.cas=== 'roulette'){playRoulette();return;}
 if(b.dataset.cas=== 'racing'){playRacing();return;}
 if(b.dataset.floor){setFloor(Number(b.dataset.floor));return;}
 if(b.dataset.fight){run(Number(b.dataset.fight));return;}
 if(b.dataset.boss){if(confirm('腐敗した騎士に挑戦する？'))run(1,true);return;}
 if(b.dataset.town){townSection=b.dataset.town;render();return;}
 if(b.dataset.job){changeJob(b.dataset.job);return;}
 if(b.dataset.buy){buy(b.dataset.buy);return;}
 if(b.dataset.equip){equip(b.dataset.equip);return;}
 if(b.dataset.sell){sell(b.dataset.sell);return;}
 if(b.dataset.forge){forge(b.dataset.forge);return;}
 switch(b.dataset.action){case 'inn':inn();break;case 'export':exportSave();break;case 'import':$('#importFile').click();break;case 'reset':if(confirm('本当にセーブを全消去してLv.1から始めますか？')){state=createState();tab='explore';lastResult=null;save();render();toast('初期化しました');}break;}
});
document.addEventListener('change',e=>{if(e.target.id==='gearFilter'){gearFilter=e.target.value;render();}if(e.target.id==='importFile'){importSave(e.target.files?.[0]);e.target.value='';}});
window.ABYSS_DEBUG={state:()=>structuredClone(state),stats:()=>derived(),shop:()=>structuredClone(shopCatalog),skills:j=>structuredClone(skills[j||state.activeJob]),reset:()=>{state=createState();save();render();},gainExp:n=>{const r=gainExperience(n);save();render();return r;},setState:s=>{if(!valid(upgradeState(s)))throw Error('invalid state');state=structuredClone(s);save();render();},casino:()=>structuredClone(state.casino),grow:()=>structuredClone(levelGrowth),fight:n=>run(n),rollSkill:()=>rollSkill(),actions:()=>actionsPerTurn(derived().agi)};
save();render();
})();
</script>
</body>
</html>
