function migrateState(raw){

  raw.inventory.forEach(item=>{item.job='mage';});
  raw.loadouts={};
  return raw;
 }
 if(raw.version===2){
  raw.activeJob=jobs[raw.activeJob]?raw.activeJob:'mage';
  raw.jobProgress=raw.jobProgress||freshJobs();
  raw.loadouts=raw.loadouts||{};
  for(const j of jobKeys){
   const p=raw.jobProgress[j];
   if(!p||!Number.isInteger(p.level)||p.level<1||p.level>JOB_CAP||!Number.isFinite(p.xp))raw.jobProgress[j]={level:1,xp:0};
  }
  raw.inventory?.forEach(item=>{if(!jobs[item.job])item.job='mage';});
 }

}

function forge(id){const item=state.inventory.find(i=>i.id===id);if(!item)return;const e=item.enhance||0;if(e>=5){toast('強化は+5まで');return;}const cost=70*(e+1)*(1+rarityOrder[item.rarity]);const ore=e>=1?e:0;if(state.gold<cost||state.ore<ore){toast('強化素材・Gが足りません');return;}state.gold-=cost;state.ore-=ore;const old=derived().maxHP;item.enhance=e+1;const newHP=derived().maxHP;state.hp=Math.min(newHP,state.hp+Math.max(0,newHP-old));logEntry('鍛冶屋で強化',item.name+' を+'+(e+1)+'へ強化（'+cost+'G、鉱石'+ore+'）');save();render();toast(item.name+' +'+(e+1)+' 強化成功');}
function setFloor(f){if(f>state.unlocked){toast('その階層はまだ解放されていません');return;}state.floor=f;selectedFloor=f;lastResult=null;save();render();}

}

function exploreHTML(){const f=state.floor,thresholdInfo=needs[f],done=state.kills[f]||0,unlockNext=f<5&&state.unlocked>f;const regular=floorEnemies[f],info=regular.map(x=>`<div class="enemy"><strong>${esc(x[0])}</strong><small>HP ${x[1]} · ATK ${x[2]} · DEF ${x[3]}<br>EXP ${x[4]} · ${x[5]}G</small></div>`).join('');return `<div class="panel"><div class="kicker">DUNGEON SELECT</div><h2 class="sectiontitle">迷宮を探索する</h2><div class="floorselect">${[1,2,3,4,5].map(n=>`<button class="floorbtn ${n===f?'active':''} ${n>state.unlocked?'locked':''}" data-floor="${n}" ${n>state.unlocked?'disabled':''}><b>第${n}層</b><small>${n>state.unlocked?'未解放':n===f?'探索中':'移動する'}</small></button>`).join('')}</div><h3 class="sectiontitle" style="margin-bottom:3px">第${f}層：${esc(floorNames[f])}</h3><p class="intro">${esc(floorDesc[f])}</p><div class="info"><span class="pill gold">獲得Gで装備を購入</span><span class="pill blue">${f>=3?'鉱石あり':'鉱石なし'}</span><span class="pill">${f===5?'最終ボス':'推奨Lv '+(f===1?'1〜4':f===2?'4〜7':f===3?'8〜12':'12〜16')}</span></div><div class="enemylist">${info}</div><div class="small muted">${f<5?'次の階層解放：':'ボス出現：'} ${Math.min(done,thresholdInfo)} / ${thresholdInfo} 戦 ${unlockNext?'（解放済み）':''}</div><div class="progressline"><span style="width:${Math.min(100,done/thresholdInfo*100)}%"></span></div><div class="controls"><label class="controlgroup small">撤退HP <input id="retreat" class="input" type="number" min="0" max="999999" value="40"></label><span class="controlnote">各戦闘終了後に判定。HP0は敗北。</span></div><div class="buttonrow"><button class="btn primary" data-fight="1">1戦</button><button class="btn" data-fight="5">5戦</button><button class="btn" data-fight="10">10戦</button><button class="btn" data-fight="20">20戦</button><button class="btn" data-fight="30">30戦</button><button class="btn gold" data-action="inn">宿屋 20G</button>${f===5?`<button class="btn gold" data-boss="1" ${done<5||state.bossDefeated?'disabled':''}>${state.bossDefeated?'ボス討伐済み':'ボス戦！'}</button>`:''}</div><p class="hint">会心攻撃：${derived().crit}%で2.5倍ダメージ。会心時HP回復+${derived().heal}。${esc(jobs[state.activeJob].desc)} 死亡すると所持Gの10%を失い、HP25%で拠点に帰還。</p></div>${resultHTML()}<section class="panel"><div class="sectiontop"><h2 class="sectiontitle">最近の戦闘</h2><span class="pill">通算 ${number(state.battleCount)}戦</span></div>${state.history.filter(x=>x.headline.includes('勝利')||x.headline.includes('ボス')||x.headline.includes('敗北')||x.headline.includes('撃破')).slice(0,4).map(x=>`<div class="log"><strong>${esc(x.headline)}</strong><p>${esc(x.body)}</p></div>`).join('')||'<div class="empty">戦闘を始めよう</div>'}</section>`;}
function gearHTML(){const d=derived();const equippedHTML=slots.map(s=>{let i=state.inventory.find(x=>x.id===state.equipped[s]);return `<div class="gear"><div class="slot">${slotName[s]}</div><div class="name ${i?'r-'+i.rarity:''}">${esc(i?i.name+(i.enhance?' +'+i.enhance:''):'未装備')}</div><div class="affix">${i?esc(statsText(i)):'装備なし'}</div></div>`;}).join('');let inv=state.inventory.filter(i=>i.job===state.activeJob&&(gearFilter==='all'||i.slot===gearFilter)),itemHTML=inv.sort((a,b)=>rarityOrder[b.rarity]-rarityOrder[a.rarity]||b.floor-a.floor).map(i=>{const equipped=state.equipped[i.slot]===i.id;const elsewhere=Object.values(state.loadouts).some(loadout=>Object.values(loadout).includes(i.id));return `<div class="item ${equipped?'equipped':''}"><div><div class="meta">${slotName[i.slot]} · <span class="r-${i.rarity}">${rarityName[i.rarity]}</span> ${equipped?'<span class="tag">装備中</span>':''}</div><h3 class="r-${i.rarity}">${esc(i.name)}${i.enhance?' +'+i.enhance:''}</h3><div class="spec">${esc(statsText(i))}</div></div><div class="itemactions">${equipped?'<span class="tag">EQUIPPED</span>':`<button class="btn primary" data-equip="${esc(i.id)}">装備</button><button class="btn ghost" data-sell="${esc(i.id)}" ${elsewhere?'disabled':''}>${elsewhere?'他ジョブで装着中':'売却 '+(i.value+12*i.enhance)+'G'}</button>`}</div></div>`}).join('');return `<div class="panel"><div class="kicker">EQUIPMENT</div><h2 class="sectiontitle">現在のビルド</h2><p class="intro">ATK ${d.atk} / DEF ${d.def} / HP ${d.maxHP} / 魔力暴走 ${d.crit}% / 暴走回復 ${d.heal}</p><div class="geargrid">${equippedHTML}</div></div><div class="panel"><div class="sectiontop"><h2 class="sectiontitle">所持装備</h2><span class="pill">${state.inventory.length}個</span></div><div class="filters"><label class="small muted">部位で絞る</label><select id="gearFilter"><option value="all">全装備</option>${slots.map(s=>`<option value="${s}" ${gearFilter===s?'selected':''}>${slotName[s]}</option>`).join('')}</select></div><div class="itemlist">${itemHTML||'<div class="empty">この部位の装備はありません</div>'}</div><p class="hint">過去ログの魔術師装備は引き続き保持。現在のジョブ用装備だけを表示します。v0.2から装備ドロップを廃止し、武器屋・防具屋で固定商品を購入できます。旧装備は自動で売却されません。</p></div>`;}
function buyShopItem(sku){
 const offer=shopCatalog.find(i=>i.sku===sku);
 if(!offer||offer.job!==state.activeJob||state.unlocked<offer.floor||state.jobProgress[state.activeJob].level<offer.level){toast('まだ購入条件を満たしていません');return;}
 if(state.inventory.some(i=>i.shopSku===sku)){toast('この商品はすでに所持しています');return;}
 if(state.gold<offer.price){toast('所持金が足りません');return;}
 const before=derived().maxHP;
 const item={id:'shop-'+(state.nextId++),job:offer.job,shopSku:offer.sku,name:offer.name,slot:offer.slot,rarity:offer.rarity,atk:offer.atk,def:offer.def,hp:offer.hp,crit:offer.crit,heal:offer.heal,enhance:0,value:Math.floor(offer.price*.35),floor:offer.floor,historical:false};
 state.gold-=offer.price;state.inventory.push(item);state.equipped[item.slot]=item.id;
 const after=derived().maxHP;state.hp=Math.min(after,state.hp+Math.max(0,after-before));
 logEntry(offer.shop==='weapon'?'武器屋で購入':'防具屋で購入',item.name+'を'+offer.price+'Gで購入し装備。');
 save();render();toast(item.name+'を購入して装備！');
}
function shopHTML(kind){
 const isWeapon=kind==='weapon';const title=isWeapon?'武器屋':'防具屋';
 const available=shopCatalog.filter(i=>i.job===state.activeJob&&i.shop===kind&&i.floor<=state.unlocked&&(isWeapon||shopSlotFilter==='all'||i.slot===shopSlotFilter));
 const slotPicker=isWeapon?'':`<label class="small muted">部位で絞る <select id="shopSlotFilter"> <option value="all">全商品</option>${slots.filter(s=>s!=='weapon').map(s=>`<option value="${s}" ${shopSlotFilter===s?'selected':''}>${slotName[s]}</option>`).join('')}</select></label>`;
 const rows=available.map(item=>{
  const owned=state.inventory.some(i=>i.shopSku===item.sku),levelLocked=state.jobProgress[state.activeJob].level<item.level,cantAfford=state.gold<item.price;
  const eq=state.inventory.find(i=>i.id===state.equipped[item.slot]);
  const comparisons=[['atk','ATK'],['def','DEF'],['hp','HP'],['crit','暴走率'],['heal','暴走回復']].map(([k,label])=>{
   const delta=(item[k]||0)-(eq?.[k]||0);return delta?label+(delta>0?'+':'')+delta:'';
  }).filter(Boolean).join(' / ')||'同等性能';
  const why=owned?'所持中':levelLocked?'ジョブLv.'+item.level+'から':cantAfford?'G不足':'購入して装備';
  return `<div class="item"><div><div class="meta">第${item.floor}層解放 / 必要ジョブLv.${item.level} / ${slotName[item.slot]} · <span class="r-${item.rarity}">${rarityName[item.rarity]}</span></div><h3 class="r-${item.rarity}">${esc(item.name)}</h3><div class="spec">${esc(statsText(item))}</div><div class="tiny muted" style="margin-top:5px">装備中との差：${esc(comparisons)}</div></div><div class="itemactions"><strong style="color:var(--gold);text-align:center">${number(item.price)}G</strong><button class="btn ${!owned&&!levelLocked&&!cantAfford?'gold':''}" data-buy="${item.sku}" ${owned||levelLocked||cantAfford?'disabled':''}>${why}</button></div></div>`;
 }).join('');
 return `<div class="panel"><div class="kicker">${isWeapon?'MAGIC WEAPON SHOP':'ARMOR & ACCESSORIES'}</div><h2 class="sectiontitle">${title}</h2><p class="intro">${isWeapon?jobs[state.activeJob].name+'専用の武器を販売。':jobs[state.activeJob].name+'専用の防具・装飾品を販売。'}購入した装備はその場で装着。いまの装備は所持品に残ります。</p><div class="info"><span class="pill gold">所持金 ${number(state.gold)}G</span><span class="pill">${jobs[state.activeJob].name}向け固定品揃え / ジョブLv.${state.jobProgress[state.activeJob].level}</span><span class="pill">解放：第${state.unlocked}層まで</span></div><div class="filters" style="margin-top:13px">${slotPicker}</div><div class="itemlist">${rows||'<div class="empty">この部位の品揃えはまだありません。</div>'}</div><p class="hint">固定価格・固定性能の試作店です。戦闘中に装備は落ちません。新商品はより深い階層の解放で入荷します。</p></div>`;
}

 return `<div class="panel"><div class="kicker">ADVENTURER GUILD</div><h2 class="sectiontitle">ジョブ・転職</h2><p class="intro">総合Lvは全ジョブ共通。戦闘でEXPを10獲得すると、総合EXPに10、現在のジョブEXPにも10入ります。分配・消費はされません。ジョブLv60に達した後はジョブEXPだけ切り捨てます。スキルは各ジョブLv5・15・30・45・60で解放され、戦闘中に自動発動します。</p><div class="info"><span class="pill gold">総合Lv.${state.level}</span><span class="pill">現在：${jobs[active].name}</span><span class="pill">ジョブLv.${state.jobProgress[active].level}</span></div><hr class="divider"><div class="jobcards">${cards}</div><p class="hint">転職すると第1層に戻り、HP割合を引き継ぎます。各ジョブ専用の装備セットは別々に保存。魔術師の旧装備・セーブは保持されます。ショップの固定品揃えはジョブで切り替わります。スキルはMP不要で、上位スキルから独立判定して最初に成功した1つのみ発動。会心・魔力暴走は別判定で重複します。発動率は各スキルの判定成功率で、実際の使用割合とは異なります。</p></div>`;

function recordHTML(){let d=derived();return `<div class="panel"><div class="kicker">ADVENTURE JOURNAL</div><h2 class="sectiontitle">冒険記録・セーブ</h2><div class="info"><span class="pill">${number(state.wins)}勝 ${state.deaths}敗</span><span class="pill">到達 第${state.unlocked}層</span><span class="pill">鉱石 ${state.ore}個</span><span class="pill ${state.bossDefeated?'good':''}">${state.bossDefeated?'腐敗した騎士 討伐':'ボス 未討伐'}</span></div><p class="hint">操作のたび自動セーブ。乱数生成器の状態も保存するため、セーブを戻せば同じ抽選結果を再現できます（ゲーム内の未来を予告する機能ではありません）。</p><div class="buttonrow"><button class="btn primary" data-action="export">JSON出力</button><button class="btn" data-action="import">JSON読込</button><button class="btn" data-action="reset-log">ログの地点へ</button><button class="btn danger" data-action="reset-new">最初から</button></div><hr class="divider"><h3 class="sectiontitle">再現根拠と補完ルール</h3><div class="notice">このゲームは会話ログを再構成した<strong>試作</strong>です。過去の47戦の個別乱数列や内部処理は復元できないため、Lv.9・第3層の確定ステータスを開始点として保存し、以降の抽選は新しい決定論的PRNGで処理します。ゲーム中の「固定シード」の言及が過去にあっても、過去の乱数値をコードから再現できるわけではありません。v0.2以降の戦闘から装備ドロップは0。v0.3で4職とジョブLv60上限を追加し、v0.4でジョブLv別スキルを追加。既存装備は引き継ぎ、過去の履歴は変更しません。</div><div class="intro"><p><b>会話から確定：</b>初期魔術師HP85・ATK21・DEF2、LvUP時HP+10・ATK+2、魔力暴走10%で2.5倍、装備補正、宿屋20G、敗北してもキャラ継続、第5層ボス「腐敗した騎士」。</p><p><b>試作で補完：</b>4〜5層の敵と数値、追加3ジョブの基礎ステータスと固有能力、ジョブ別武器屋・防具屋の品揃えと価格、死亡ペナルティ、階層解放条件、鍛冶屋強化、鉱石抽選、EXPテーブルのレベル10以降。</p><p><b>戦闘：</b>先制魔弾→敵が生存なら反撃。基本ダメージ = max(1, ATK−DEF)。暴走は攻撃ごとの独立判定。防御力・HPは装備で増加。HP撤退条件は戦闘の前後でチェックするため、途中でHP0になる可能性があります。v0.4から4職×5のスキルを追加。MPはなく、威力・発動率・追加効果は仮設定です。魔力暴走は魔術師のパッシブとして維持しています。</p></div><hr class="divider"><div class="sectiontop"><h3 class="sectiontitle">履歴</h3><span class="pill">最新 ${state.history.length}件</span></div>${state.history.slice(0,50).map(x=>`<div class="log"><div class="date">${esc(x.at)}</div><strong>${esc(x.headline)}</strong><p>${esc(x.body)}</p></div>`).join('')}</div>`;}
function render(){renderHero();document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('#view').innerHTML=tab==='explore'?exploreHTML():tab==='gear'?gearHTML():tab==='town'?townHTML():tab==='jobs'?jobsHTML():recordHTML();}
function downloadSave(){const json=JSON.stringify({app:'INFINITE_ABYSS',exportedAt:new Date().toISOString(),state},null,2),blob=new Blob([json],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='abyss-save-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);toast('セーブデータを出力しました');}
function importSave(file){if(!file)return;const rd=new FileReader();rd.onload=()=>{try{const j=JSON.parse(rd.result),loaded=migrateState(j.state||j);if(!isValid(loaded))throw new Error('形式が一致しません');if(!confirm('現在のセーブデータを上書きします。元の内容は消えます。続行しますか？'))return;state=loaded;tab='explore';selectedFloor=state.floor;lastResult=null;save();render();toast('セーブデータを復元しました');}catch(e){toast('読み込めません：'+e.message);}};rd.readAsText(file);}
document.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b||b.disabled)return;if(b.dataset.tab){tab=b.dataset.tab;lastResult=null;render();return;}if(b.dataset.floor){setFloor(Number(b.dataset.floor));return;}if(b.dataset.fight){run(Number(b.dataset.fight));return;}if(b.dataset.boss){if(confirm('第5層ボス「腐敗した騎士」に挑戦しますか？'))run(1,true);return;}if(b.dataset.equip){equip(b.dataset.equip);return;}if(b.dataset.sell){sell(b.dataset.sell);return;}if(b.dataset.forge){forge(b.dataset.forge);return;}if(b.dataset.buy){buyShopItem(b.dataset.buy);return;}if(b.dataset.job){changeJob(b.dataset.job);return;}if(b.dataset.town){townSection=b.dataset.town;shopSlotFilter='all';render();return;}switch(b.dataset.action){case 'inn':inn();break;case 'export':downloadSave();break;case 'import':$('#importFile').click();break;case 'reset-log':if(confirm('セーブデータを破棄して、チャットログのLv.9・第3層の状態に戻しますか？')){state=createState();lastResult=null;tab='explore';save();render();toast('ログ再現地点に戻りました');}break;case 'reset-new':if(confirm('今のデータを破棄してLv.1から始めますか？ 戻せません。')){state=createState('new');lastResult=null;tab='explore';save();render();toast('Lv.1から新しい冒険を開始！');}break;}});
document.addEventListener('change',ev=>{if(ev.target.id==='gearFilter'){gearFilter=ev.target.value;render();}if(ev.target.id==='shopSlotFilter'){shopSlotFilter=ev.target.value;render();}if(ev.target.id==='importFile'){importSave(ev.target.files[0]);ev.target.value='';}});
window.ABYSS_DEBUG={changeJob:key=>changeJob(key),gainExp:amount=>gainExperience(amount),getState:()=>JSON.parse(JSON.stringify(state)),stats:()=>derived(),buy:sku=>buyShopItem(sku),shopCatalog:()=>shopCatalog,selectTown:t=>{townSection=t;tab='town';render();},fight:n=>run(n),reset:mode=>{state=createState(mode==='new'?'new':'continue');lastResult=null;save();render();},setRng:n=>{state.rng=n>>>0;save();},skills:job=>JSON.parse(JSON.stringify(skills[job||state.activeJob])),rollSkill:()=>rollSkill(state.activeJob)};
save();render();
})();
