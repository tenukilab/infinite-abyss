  }).filter(Boolean).join(' / ')||'同等性能';
  const why=owned?'所持中':levelLocked?'Lv.'+item.level+'から':cantAfford?'G不足':'購入して装備';
  return `<div class="item"><div><div class="meta">第${item.floor}層解放 / 必要Lv.${item.level} / ${slotName[item.slot]} · <span class="r-${item.rarity}">${rarityName[item.rarity]}</span></div><h3 class="r-${item.rarity}">${esc(item.name)}</h3><div class="spec">${esc(statsText(item))}</div><div class="tiny muted" style="margin-top:5px">装備中との差：${esc(comparisons)}</div></div><div class="itemactions"><strong style="color:var(--gold);text-align:center">${number(item.price)}G</strong><button class="btn ${!owned&&!levelLocked&&!cantAfford?'gold':''}" data-buy="${item.sku}" ${owned||levelLocked||cantAfford?'disabled':''}>${why}</button></div></div>`;
 }).join('');
 return `<div class="panel"><div class="kicker">${isWeapon?'MAGIC WEAPON SHOP':'ARMOR & ACCESSORIES'}</div><h2 class="sectiontitle">${title}</h2><p class="intro">${isWeapon?'杖を買って火力を伸ばす。':'帽子・ローブ・手袋・腰帯・靴・首飾り・指輪を取り扱う。'}購入した装備はその場で装着。いまの装備は所持品に残ります。</p><div class="info"><span class="pill gold">所持金 ${number(state.gold)}G</span><span class="pill">品揃え：第${state.unlocked}層まで</span></div><div class="filters" style="margin-top:13px">${slotPicker}</div><div class="itemlist">${rows||'<div class="empty">この部位の品揃えはまだありません。</div>'}</div><p class="hint">固定価格・固定性能の試作店です。戦闘中に装備は落ちません。新商品はより深い階層の解放で入荷します。</p></div>`;
}
function servicesHTML(){const d=derived();return `<div class="panel"><div class="kicker">THE CAMP</div><h2 class="sectiontitle">冒険者の休息所</h2><p class="intro">宿屋で回復、鍛冶屋で装備強化。武器や防具は店で購入できます。</p><div class="towncards"><div class="towncard"><h3>⌂ 宿屋</h3><p>20GでHP全回復。拠点に帰還し、傷を癒す。</p><button class="btn primary" data-action="inn" ${state.gold<20||state.hp>=d.maxHP?'disabled':''}>全回復 · 20G</button></div><div class="towncard"><h3>⚒ 鍛冶屋 <span class="pill blue">試作仕様</span></h3><p>装備を+5まで強化。強化は必ず成功。2回目以降は灰鉄鉱石が必要。</p><span class="small">鉱石所持：<b>${number(state.ore)}</b>個</span></div></div><hr class="divider"><div class="sectiontop"><h3 class="sectiontitle">装備を強化する</h3><span class="pill">所持 ${number(state.gold)}G</span></div><div class="forgeitems">${slots.map(s=>{const i=state.inventory.find(x=>x.id===state.equipped[s]);if(!i)return '';const e=i.enhance||0,cost=70*(e+1)*(1+rarityOrder[i.rarity]),ore=e>=1?e:0;return `<div class="forgerow"><div><strong>${slotName[s]}：${esc(i.name)}${e?' +'+e:''}</strong><small>${esc(statsText(i))} · 次強化 ${e>=5?'上限':cost+'G / 鉱石'+ore}</small></div><button class="btn" data-forge="${esc(i.id)}" ${e>=5||state.gold<cost||state.ore<ore?'disabled':''}>強化</button></div>`}).join('')}</div><p class="hint">強化・鉱石システムはチャットログに詳細がなかったため、この試作で補ったルールです。</p></div>`;}
function townHTML(){
 const nav=`<div class="panel"><div class="kicker">THE CAMP · MERCHANTS</div><h2 class="sectiontitle">拠点の施設</h2><div class="shopnav"><button class="btn ${townSection==='weapon'?'primary':''}" data-town="weapon">⚔ 武器屋</button><button class="btn ${townSection==='armor'?'primary':''}" data-town="armor">◇ 防具屋</button><button class="btn ${townSection==='services'?'primary':''}" data-town="services">⌂ 宿屋・鍛冶屋</button></div></div>`;
 return nav+(townSection==='services'?servicesHTML():shopHTML(townSection));
}
function recordHTML(){let d=derived();return `<div class="panel"><div class="kicker">ADVENTURE JOURNAL</div><h2 class="sectiontitle">冒険記録・セーブ</h2><div class="info"><span class="pill">${number(state.wins)}勝 ${state.deaths}敗</span><span class="pill">到達 第${state.unlocked}層</span><span class="pill">鉱石 ${state.ore}個</span><span class="pill ${state.bossDefeated?'good':''}">${state.bossDefeated?'腐敗した騎士 討伐':'ボス 未討伐'}</span></div><p class="hint">操作のたび自動セーブ。乱数生成器の状態も保存するため、セーブを戻せば同じ抽選結果を再現できます（ゲーム内の未来を予告する機能ではありません）。</p><div class="buttonrow"><button class="btn primary" data-action="export">JSON出力</button><button class="btn" data-action="import">JSON読込</button><button class="btn" data-action="reset-log">ログの地点へ</button><button class="btn danger" data-action="reset-new">最初から</button></div><hr class="divider"><h3 class="sectiontitle">再現根拠と補完ルール</h3><div class="notice">このゲームは会話ログを再構成した<strong>試作</strong>です。過去の47戦の個別乱数列や内部処理は復元できないため、Lv.9・第3層の確定ステータスを開始点として保存し、以降の抽選は新しい決定論的PRNGで処理します。ゲーム中の「固定シード」の言及が過去にあっても、過去の乱数値をコードから再現できるわけではありません。v0.2以降の戦闘から装備ドロップは0。既存装備は引き継ぎ、過去の履歴は変更しません。</div><div class="intro"><p><b>会話から確定：</b>初期魔術師HP85・ATK21・DEF2、LvUP時HP+10・ATK+2、魔力暴走10%で2.5倍、装備補正、宿屋20G、敗北してもキャラ継続、第5層ボス「腐敗した騎士」。</p><p><b>試作で補完：</b>4〜5層の敵と数値、武器屋・防具屋の品揃えと価格、死亡ペナルティ、階層解放条件、鍛冶屋強化、鉱石抽選、EXPテーブルのレベル10以降。</p><p><b>戦闘：</b>先制魔弾→敵が生存なら反撃。基本ダメージ = max(1, ATK−DEF)。暴走は攻撃ごとの独立判定。防御力・HPは装備で増加。HP撤退条件は戦闘の前後でチェックするため、途中でHP0になる可能性があります。</p></div><hr class="divider"><div class="sectiontop"><h3 class="sectiontitle">履歴</h3><span class="pill">最新 ${state.history.length}件</span></div>${state.history.slice(0,50).map(x=>`<div class="log"><div class="date">${esc(x.at)}</div><strong>${esc(x.headline)}</strong><p>${esc(x.body)}</p></div>`).join('')}</div>`;}
function render(){renderHero();document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('#view').innerHTML=tab==='explore'?exploreHTML():tab==='gear'?gearHTML():tab==='town'?townHTML():recordHTML();}
function downloadSave(){const json=JSON.stringify({app:'INFINITE_ABYSS',exportedAt:new Date().toISOString(),state},null,2),blob=new Blob([json],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='abyss-save-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);toast('セーブデータを出力しました');}
function importSave(file){if(!file)return;const rd=new FileReader();rd.onload=()=>{try{const j=JSON.parse(rd.result),loaded=j.state||j;if(!isValid(loaded))throw new Error('形式が一致しません');if(!confirm('現在のセーブデータを上書きします。元の内容は消えます。続行しますか？'))return;state=loaded;tab='explore';selectedFloor=state.floor;lastResult=null;save();render();toast('セーブデータを復元しました');}catch(e){toast('読み込めません：'+e.message);}};rd.readAsText(file);}
document.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b||b.disabled)return;if(b.dataset.tab){tab=b.dataset.tab;lastResult=null;render();return;}if(b.dataset.floor){setFloor(Number(b.dataset.floor));return;}if(b.dataset.fight){run(Number(b.dataset.fight));return;}if(b.dataset.boss){if(confirm('第5層ボス「腐敗した騎士」に挑戦しますか？'))run(1,true);return;}if(b.dataset.equip){equip(b.dataset.equip);return;}if(b.dataset.sell){sell(b.dataset.sell);return;}if(b.dataset.forge){forge(b.dataset.forge);return;}if(b.dataset.buy){buyShopItem(b.dataset.buy);return;}if(b.dataset.town){townSection=b.dataset.town;shopSlotFilter='all';render();return;}switch(b.dataset.action){case 'inn':inn();break;case 'export':downloadSave();break;case 'import':$('#importFile').click();break;case 'reset-log':if(confirm('セーブデータを破棄して、チャットログのLv.9・第3層の状態に戻しますか？')){state=createState();lastResult=null;tab='explore';save();render();toast('ログ再現地点に戻りました');}break;case 'reset-new':if(confirm('今のデータを破棄してLv.1から始めますか？ 戻せません。')){state=createState('new');lastResult=null;tab='explore';save();render();toast('Lv.1から新しい冒険を開始！');}break;}});
document.addEventListener('change',ev=>{if(ev.target.id==='gearFilter'){gearFilter=ev.target.value;render();}if(ev.target.id==='shopSlotFilter'){shopSlotFilter=ev.target.value;render();}if(ev.target.id==='importFile'){importSave(ev.target.files[0]);ev.target.value='';}});
window.ABYSS_DEBUG={getState:()=>JSON.parse(JSON.stringify(state)),stats:()=>derived(),buy:sku=>buyShopItem(sku),shopCatalog:()=>shopCatalog,selectTown:t=>{townSection=t;tab='town';render();},fight:n=>run(n),reset:mode=>{state=createState(mode==='new'?'new':'continue');lastResult=null;save();render();},setRng:n=>{state.rng=n>>>0;save();}};
save();render();
})();
</script>
