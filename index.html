/* Foreground auto expedition: compact controls and live progress for iPhone Safari. */
.auto-panel{border-color:#47665e;background:linear-gradient(140deg,#172e35,#131d2c)}
.auto-panel .auto-config{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}
.auto-field{min-width:0;display:grid;gap:5px;color:var(--muted);font-size:12px}

function codexMonsterId(dungeon,name,isBoss=false,foeId=null,floor=null){
 if(dungeon==='isekai'){
  const e=foeId?ISEKAI_BOSSES.find(b=>b.id===foeId):ISEKAI_BOSSES.find(b=>b.name===name);
  return e?'isekai:'+e.id:null;

function newCodex(){return {schema:CODEX_SCHEMA,monsters:{},magics:{},backfilled:false};}

function codexMonsterRecord(c,id){if(!CODEX_MONSTER_BY_ID[id])return null;
 if(!c.monsters[id]||typeof c.monsters[id]!=='object')c.monsters[id]=newMonsterRecord();return c.monsters[id];}
function codexMagicRecord(c,key){if(!MAGIC_CATALOG.some(m=>m.kind==='spell'&&m.key===key))return null;

function markCodexSighting(foe,dungeon='isekai',isBoss=true){const id=codexMonsterId(dungeon,foe.name,isBoss,foe.id,foe.floor);

function markCodexMagic(key,source='other'){

}
function markCodexBattle(foe,dungeon,isBoss,outcome,magicDrop=null){

function normalizeCodex(save){

 // Only last saved detailed battles are recoverable. Older aggregate kills cannot
 // be attributed to individual monster species, so never fabricate per-species wins.
 const fromRecord=(r,dungeon)=>{
  const id=codexMonsterId(dungeon,r.name,!!r.isBoss),entry=codexMonsterRecord(c,id);
  if(!entry)return;
  entry.sightings++;entry.battles++;
  if(r.win)entry.wins++;else if(r.retreated)entry.retreats++;else entry.losses++;
  if(entry.firstBattle==null||r.id<entry.firstBattle)entry.firstBattle=r.id;
  if(entry.lastBattle==null||r.id>entry.lastBattle)entry.lastBattle=r.id;
  const k=r.magicDrop?.key;if(k){const m=codexMagicRecord(c,k);if(m){m.discovered=true;m.drops++;}entry.drops[k]=(entry.drops[k]||0)+1;}
 };

 // can be recovered from the limited log, excluding forest/otherworld summaries.
 for(const h of save.history||[]){

  if(m[1]==='勝利'||m[1]==='ボス撃破')e.wins++;else if(m[1]==='敗北')e.losses++;else e.retreats++;
  if(e.firstBattle==null||h.id<e.firstBattle)e.firstBattle=h.id;

 }

function runAutoStep(){const a=autoSession;if(!a?.running)return;
 // Check again before scheduling a new fight, including browser lifecycle safety.
 if(currentHP()<=derived().maxHP*a.retreatPercent/100){finishAutoRun('HP'+a.retreatPercent+'%以下で撤退');return;}
 if(a.stopAtMaster&&isJobMaster(a.job)){finishAutoRun('ジョブマスター到達');return;}
 if(a.completed>=a.target){finishAutoRun('周回数の上限に到達');return;}
 try{
  let preselected=null;
  if(a.dungeon==='isekai'){
   preselected=holdIsekaiBoss();
   if(preselected.passiveCat&&a.stopOnPeeluna){
    a.rareEncounters++;
    // The final save includes this encounter for the next manual battle.
    finishAutoRun('異世界に迷い込んだぴーるなに遭遇（戦闘前に停止）');return;
   }
   if(preselected.passiveCat)a.rareEncounters++;
  }
  const result=fightOne(a.floor,a.isBoss,a.dungeon,preselected);
  a.completed++;a.exp+=result.exp;a.gold+=result.gold;a.ore+=result.ore;
  a.levelUps+=result.levelUps||0;a.jobUps+=result.jobUps||0;
  a.masteryExp+=(result.masteryGains||[]).reduce((total,g)=>total+g.exp,0);
  a.magicUsed+=Object.values(result.magicUses||{}).reduce((total,n)=>total+n,0);
  if(result.magicDrop){a.magicDrops++;a.magicFound[result.magicDrop.name]=(a.magicFound[result.magicDrop.name]||0)+1;}
  if(a.dungeon==='isekai'){
   state.isekai.battleRecords.unshift({id:state.battleCount,dungeon:'isekai',name:result.name,win:result.win,retreated:!!result.retreated,rounds:result.rounds,damage:result.damage,heal:result.heal,exp:result.exp,gold:result.gold,magicDrop:result.magicDrop||null,turns:result.turnLogs||[]});
   if(state.isekai.battleRecords.length>ISEKAI_RECORD_LIMIT)state.isekai.battleRecords.length=ISEKAI_RECORD_LIMIT;
  }
  if(a.dungeon==='forest'){
   state.forest.battleRecords.unshift({id:state.battleCount,floor:a.floor,isBoss:a.isBoss,name:result.name,win:result.win,retreated:!!result.retreated,rounds:result.rounds,damage:result.damage,heal:result.heal,exp:result.exp,gold:result.gold,turns:result.turnLogs||[]});
   if(state.forest.battleRecords.length>FOREST_RECORD_LIMIT)state.forest.battleRecords.length=FOREST_RECORD_LIMIT;
  }
  state.autoRunProgress=autoSnapshot(a);
  if(!save()){finishAutoRun('保存できなかったため停止',{persist:false});return;}
  if(a.completed%AUTO_DRAW_EVERY===0){renderHero();refreshAutoPanel();}
  if(!result.win){finishAutoRun(result.retreated?'150ターン時間切れ・撤退':'敗北（即停止）');return;}
  if(a.stopAtMaster&&isJobMaster(a.job)){finishAutoRun('ジョブマスター到達');return;}
  if(currentHP()<=derived().maxHP*a.retreatPercent/100){finishAutoRun('HP'+a.retreatPercent+'%以下で撤退');return;}
  if(a.isBoss&&a.dungeon==='main'){finishAutoRun('通常迷宮のボス討伐（再戦不可）');return;}
  if(a.goldGoal&&a.gold>=a.goldGoal){finishAutoRun('獲得Gの目標に到達（'+num(a.goldGoal)+'G）');return;}
  if(a.masteryGoal&&a.masteryExp>=a.masteryGoal){finishAutoRun('熟練EXPの目標に到達（'+num(a.masteryGoal)+'）');return;}
  if(a.completed>=a.target){finishAutoRun('周回数の上限に到達');return;}
  a.timer=setTimeout(runAutoStep,AUTO_TICK_MS);
 }catch(err){console.error('auto expedition error',err);finishAutoRun('処理エラーで停止');}
}

 const floor=dungeon==='isekai'?0:dungeon==='forest'?state.forest.floor:state.floor;

 if(isBoss&&!bossAllowed){toast('ボス戦を周回するにはボス許可を有効にしてください');return;}
 if(stopAtMaster&&isJobMaster(state.activeJob)){toast('現在のジョブはすでにMASTERです。停止設定を変更してください');return;}
 if(currentHP()<=derived().maxHP*retreatPercent/100){toast('HPが撤退条件に達しています。回復してから開始してください');return;}
 autoSession={running:true,dungeon,floor,isBoss,job:state.activeJob,target,completed:0,retreatPercent,stopAtMaster,goldGoal,masteryGoal,bossAllowed,stopOnPeeluna,exp:0,gold:0,ore:0,levelUps:0,jobUps:0,masteryExp:0,magicUsed:0,magicDrops:0,magicFound:{},rareEncounters:0,startedAt:new Date().toISOString(),timer:null};
 state.autoRunProgress=autoSnapshot(autoSession);

  toast('保存できなかったため自動周回を開始できません');return;

function run(count,isBoss=false,dungeon='main'){
 if(autoSession?.running){toast('自動周回中です。先に停止してください');return;}
 if(dungeon==='isekai'){
  if(state.location!=='isekai'||!isBoss){toast('異世界の門から挑戦してください');return;}
  count=1;
 }else if(dungeon==='forest'){
  if(state.location!=='forest'){toast('魔の森に移動してください');return;}
  if(isBoss!==isForestBossFloor(state.forest.floor)){toast('この階層では選択した戦闘ができません');return;}
  if(isBoss)count=1;
 }else{
  if(state.location!=='main'){toast('通常迷宮には拠点から移動してください');return;}
  if(isBoss&&(state.floor!==5||state.kills[5]<floors[5].need||state.bossDefeated)){toast('ボス出現条件が未達成');return;}
 }
 if(!Number.isInteger(count)||count<1||count>30)return;
 const floor=dungeon==='isekai'?0:dungeon==='forest'?state.forest.floor:state.floor,retreat=Number($('#retreat')?.value??40);
 if(!Number.isFinite(retreat)||retreat<0){toast('撤退HPは0以上');return;}
 const results=[];let exp=0,gold=0,ore=0,jobUps=0,levelUps=0,surges=0,misses=0,dodges=0,reason='周回完了';const masteryTotals={},magicTotals={};
 for(let i=0;i<count;i++){
  if(currentHP()<=retreat){reason='撤退条件に到達';break;}
  const r=fightOne(floor,isBoss,dungeon);results.push(r);
  if(dungeon==='isekai'){
   const entry={id:state.battleCount,dungeon:'isekai',name:r.name,win:r.win,retreated:!!r.retreated,rounds:r.rounds,damage:r.damage,heal:r.heal,exp:r.exp,gold:r.gold,magicDrop:r.magicDrop||null,turns:r.turnLogs||[]};
   state.isekai.battleRecords.unshift(entry);
   if(state.isekai.battleRecords.length>ISEKAI_RECORD_LIMIT)state.isekai.battleRecords.length=ISEKAI_RECORD_LIMIT;
  }
  if(dungeon==='forest'){
   const entry={id:state.battleCount,floor,isBoss,name:r.name,win:r.win,retreated:!!r.retreated,rounds:r.rounds,damage:r.damage,heal:r.heal,exp:r.exp,gold:r.gold,turns:r.turnLogs||[]};
   state.forest.battleRecords.unshift(entry);

  }

  for(const g of r.masteryGains||[]){const k=g.id;if(!masteryTotals[k])masteryTotals[k]={name:g.name,exp:0,levels:0};masteryTotals[k].exp+=g.exp;masteryTotals[k].levels+=g.levels;}
  if(!r.win){reason=r.retreated?'150ターン経過・撤退':'敗北・拠点へ帰還';break;}

 }

 lastResult={results,exp,gold,ore,jobUps,levelUps,surges,misses,dodges,reason,dungeon,masteryTotals:Object.values(masteryTotals),magicTotals};save();render();
}

const openMagicGroups=new Set();
function magicInventoryHTML(scope,renderItem){
 const groups=new Map();
 for(const item of state.magics){
  const key=scope+':'+item.kind+':'+item.key;
  if(!groups.has(key))groups.set(key,[]);
  groups.get(key).push(item);
 }
 return [...groups].map(([key,items])=>{
  if(items.length===1)return renderItem(items[0]);
  return `<details class="magic-inventory-group" data-magic-group="${esc(key)}" ${openMagicGroups.has(key)?'open':''}><summary>${esc(items[0].name)} ×${num(items.length)}</summary><div class="itemlist">${items.map(renderItem).join('')}</div></details>`;
 }).join('');
}

function wagerFrom(selector){
 const value=Number($(selector)?.value);
 if(!Number.isInteger(value)||value<1||value>500){toast('賭けるメダルは1〜500枚');return null;}
 if(value>state.medals){toast('メダルが足りません');return null;}
 return value;

const pokerSuits=['♠','♥','♦','♣'];
function cardText(card){return {rank:card%13+2,suit:pokerSuits[Math.floor(card/13)]};}
function displayCard(card){const c=cardText(card);const r=({11:'J',12:'Q',13:'K',14:'A'})[c.rank]||c.rank;return r+c.suit;}
function shuffleDeck(){const deck=Array.from({length:52},(_,i)=>i);for(let i=51;i>0;i--){const j=ri(0,i);[deck[i],deck[j]]=[deck[j],deck[i]];}return deck;}
function pokerResult(cards){
 const ranks=cards.map(c=>cardText(c).rank).sort((a,b)=>a-b),suits=cards.map(c=>Math.floor(c/13));
 const counts={};for(const r of ranks)counts[r]=(counts[r]||0)+1;
 const byCount=Object.entries(counts).map(([k,v])=>({rank:Number(k),count:v})).sort((a,b)=>b.count-a.count||b.rank-a.rank);
 const flush=suits.every(v=>v===suits[0]);
 const uniq=[...new Set(ranks)];
 const straight=uniq.length===5&&(uniq[4]-uniq[0]===4||uniq.join(',')==='2,3,4,5,14');
 if(straight&&flush&&uniq[0]===10)return {name:'ロイヤルフラッシュ',mult:200};
 if(straight&&flush)return {name:'ストレートフラッシュ',mult:50};
 if(byCount[0].count===4)return {name:'フォーカード',mult:25};
 if(byCount[0].count===3&&byCount[1].count===2)return {name:'フルハウス',mult:9};
 if(flush)return {name:'フラッシュ',mult:6};
 if(straight)return {name:'ストレート',mult:4};
 if(byCount[0].count===3)return {name:'スリーカード',mult:3};
 if(byCount[0].count===2&&byCount[1].count===2)return {name:'ツーペア',mult:2};
 if(byCount[0].count===2&&byCount[0].rank>=11)return {name:'ジャックス・オア・ベター',mult:1};
 return {name:'ノーペア',mult:0};
}
function dealPoker(){
 if(state.location!=='casino'||state.casino.poker?.stage==='hold')return;
 const bet=wagerFrom('#pokerBet');if(!bet)return;
 state.medals-=bet;
 const deck=shuffleDeck();
 state.casino.poker={stage:'hold',bet,hand:deck.slice(0,5),remaining:deck.slice(5),held:[false,false,false,false,false],result:null};
 state.casino.plays++;state.casino.last='5枚配った。残したいカードを選んでドロー！';save();render();
}
function holdCard(index){
 const p=state.casino.poker;
 if(state.location!=='casino'||p?.stage!=='hold'||index<0||index>=5||!Number.isInteger(index))return;
 p.held[index]=!p.held[index];save();render();
}
function drawPoker(){
 const p=state.casino.poker;if(state.location!=='casino'||p?.stage!=='hold')return;
 for(let i=0;i<5;i++)if(!p.held[i])p.hand[i]=p.remaining.shift();
 const result=pokerResult(p.hand);
 // Luck: a small chance for one additional helpful draw when the hand would lose.
 if(!result.mult&&rand()<clamp(derived().luk*.0007,0,.045)){
  let best=null;
  for(let i=0;i<5;i++)for(let j=0;j<p.remaining.length;j++){
   const trial=[...p.hand];trial[i]=p.remaining[j];const r=pokerResult(trial);
   if(r.mult&&(!best||r.mult>best.result.mult))best={i,j,result:r};
  }
  if(best){p.hand[best.i]=p.remaining.splice(best.j,1)[0];result.name=best.result.name;result.mult=best.result.mult;}
 }
 const win=p.bet*result.mult;state.medals+=win;
 p.stage='finished';p.result={...result,win};delete p.remaining;
 state.casino.last=result.name+'：'+(win?win+'メダル獲得':'払い戻しなし')+'（賭け金'+p.bet+'）';
 logEntry('ポーカー',state.casino.last);save();render();
}
const rouletteReds=new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);
function rouletteWin(choice,number,picked){
 if(choice==='number')return number===picked;
 if(number===0)return false;
 if(choice==='red')return rouletteReds.has(number);
 if(choice==='black')return !rouletteReds.has(number);
 if(choice==='even')return number%2===0;
 if(choice==='odd')return number%2===1;
 return false;
}
function playRoulette(){
 if(state.location!=='casino')return;
 const bet=wagerFrom('#rouletteBet');if(!bet)return;
 const choice=$('#rouletteChoice')?.value;
 const picked=Number($('#rouletteNumber')?.value);
 if(!['red','black','even','odd','number'].includes(choice))return;
 if(choice==='number'&&(!Number.isInteger(picked)||picked<0||picked>36))return;
 state.medals-=bet;let number=ri(0,36);
 if(!rouletteWin(choice,number,picked)&&rand()<clamp(derived().luk*.0008,0,.055))number=ri(0,36);
 const won=rouletteWin(choice,number,picked),mult=choice==='number'?36:2,payout=won?bet*mult:0;
 state.medals+=payout;state.casino.plays++;
 const color=number===0?'緑':rouletteReds.has(number)?'赤':'黒';
 state.casino.last='ルーレット：'+number+'（'+color+'） '+(won?'当たり！ '+payout+'メダル獲得':'ハズレ')+' / '+bet+'メダル賭け';
 logEntry('ルーレット',state.casino.last);save();render();
}
function playRacing(){
 if(state.location!=='casino')return;
 const bet=wagerFrom('#raceBet');if(!bet)return;
 const choice=Number($('#raceHorse')?.value);
 if(!Number.isInteger(choice)||choice<0||choice>=horseRoster.length)return;
 state.medals-=bet;
 const total=horseRoster.reduce((n,h)=>n+h.weight,0);
 let ticket=ri(1,total),winner=horseRoster.findIndex(h=>{ticket-=h.weight;return ticket<=0;});
 if(winner!==choice&&rand()<clamp(derived().luk*.00055,0,.05))winner=choice;
 const won=winner===choice,payout=won?bet*horseRoster[choice].payout:0;
 state.medals+=payout;state.casino.plays++;
 state.casino.last='競馬：優勝 '+horseRoster[winner].name+' / '+(won?'的中！ '+payout+'メダル獲得':'ハズレ')+' / '+bet+'メダル賭け';

}

}

function importSave(file){
 if(!file)return;
 const reader=new FileReader();
 reader.onerror=reader.onabort=()=>toast('JSONファイルを読み込めませんでした');

  if(autoSession?.running){toast('自動周回を停止してからJSONを読み込んでください');return;}
  let candidate;
  try{
   const data=JSON.parse(reader.result);
   const payload=isRecord(data)&&Object.hasOwn(data,'state')?data.state:data;
   candidate=prepareSave(payload);
  }catch(e){toast('読み込み失敗：'+e.message);return;}
  try{
   const current=localStorage.getItem(KEY);
   if(!confirm('現在の進行と保存済みの version 5 データを上書きします。続けますか？'))return;
   persistSave(candidate,current);
  }catch(e){
   console.warn('save import failed',e);
   toast('復元データを保存できませんでした。現在のデータを保持しています。');return;
  }
  saveRecovery=null;
  showRestoredState(candidate);
  toast('データを復元しました');
 };
 reader.readAsText(file);
}
